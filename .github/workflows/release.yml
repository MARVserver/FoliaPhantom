name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: folia-phantom

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF}" == refs/heads/release/v* ]]; then
            VERSION="${GITHUB_REF_NAME#release/v}"
          elif [[ -n "${{ inputs.version || '' }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            echo "A version is required for manual runs" >&2
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: folia-phantom/**/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set Maven release version
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion=${{ steps.version.outputs.version }}
          -DgenerateBackupPoms=false

      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress --fail-at-end clean verify

      - name: Check GitHub Packages version
        id: package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_URL="https://maven.pkg.github.com/MARVserver/pasta/com/patch/folia-phantom/${VERSION}/folia-phantom-${VERSION}.pom"
          STATUS="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "${PACKAGE_URL}")"

          case "${STATUS}" in
            200)
              echo "GitHub Packages already contains com.patch:folia-phantom:${VERSION}; skipping deploy."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "GitHub Packages does not contain version ${VERSION}; it will be published."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected GitHub Packages response: HTTP ${STATUS}" >&2
              exit 1
              ;;
          esac

      - name: Publish Maven packages
        if: steps.package.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn --batch-mode --no-transfer-progress --fail-at-end
          -DskipTests deploy

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          find . -path '*/target/*.jar' -type f ! -name 'original-*.jar' -print0 \
            | xargs -0 -I{} cp '{}' release/
          test -n "$(find release -maxdepth 1 -name '*.jar' -print -quit)"
          cd release
          sha256sum *.jar > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pasta-${{ steps.version.outputs.tag }}
          path: folia-phantom/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: pasta ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            folia-phantom/release/*.jar
            folia-phantom/release/SHA256SUMS
