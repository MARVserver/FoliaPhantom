name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release pasta
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          "VERSION=$($env:GITHUB_REF_NAME -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Build release ZIPs
        shell: pwsh
        run: ./scripts/release.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      - name: Collect release artifacts
        id: artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $artifacts = Get-ChildItem dist -Filter "pasta-*-$version.zip" | Sort-Object Name
          if ($artifacts.Count -ne 12) {
            Write-Error "Expected 12 release ZIPs, found $($artifacts.Count)."
            Get-ChildItem dist -Recurse
            exit 1
          }

          $artifactList = ($artifacts | ForEach-Object { $_.FullName }) -join "`n"
          "ARTIFACTS<<EOF" >> $env:GITHUB_OUTPUT
          $artifactList >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "pasta ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.artifacts.outputs.ARTIFACTS }}
          body: |
            ## pasta ${{ github.ref_name }}

            ### Assets
            | File | Description |
            |------|-------------|
            | `pasta-folia-*.zip` | Folia Windows GUI, Linux GUI, and CLI distributions |
            | `pasta-shreddedpaper-*.zip` | ShreddedPaper Windows GUI, Linux GUI, and CLI distributions |
            | `pasta-canvas-*.zip` | Canvas Windows GUI, Linux GUI, and CLI distributions |
            | `pasta-horizon-*.zip` | Horizon Windows GUI, Linux GUI, and CLI distributions |

            FoliaPhantom has been renamed to pasta. The GitHub Wiki has been replaced by repository documentation under `docs/`.
