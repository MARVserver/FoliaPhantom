name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release pasta
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          "VERSION=$($env:GITHUB_REF_NAME -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Build release ZIPs
        shell: pwsh
        run: ./scripts/release.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      - name: Collect release artifacts
        id: artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $windowsGui = "dist/pasta-windows-gui-$version.zip"
          $linuxGui = "dist/pasta-linux-gui-$version.zip"
          $cli = "dist/pasta-cli-$version.zip"

          foreach ($file in @($windowsGui, $linuxGui, $cli)) {
            if (-not (Test-Path $file)) {
              Write-Error "Required artifact not found: $file"
              Get-ChildItem dist -Recurse
              exit 1
            }
          }

          "WINDOWS_GUI=$windowsGui" >> $env:GITHUB_OUTPUT
          "LINUX_GUI=$linuxGui" >> $env:GITHUB_OUTPUT
          "CLI=$cli" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "pasta ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.WINDOWS_GUI }}
            ${{ steps.artifacts.outputs.LINUX_GUI }}
            ${{ steps.artifacts.outputs.CLI }}
          body: |
            ## pasta ${{ github.ref_name }}

            ### Assets
            | File | Description |
            |------|-------------|
            | `pasta-windows-gui-*.zip` | Windows GUI distribution |
            | `pasta-linux-gui-*.zip` | Linux GUI distribution |
            | `pasta-cli-*.zip` | Command-line distribution |

            FoliaPhantom has been renamed to pasta. The GitHub Wiki has been replaced by repository documentation under `docs/`.
