name: Pages

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: folia-phantom/pom.xml

      - name: Build web JAR
        working-directory: folia-phantom
        run: mvn --batch-mode --no-transfer-progress -pl folia-phantom-web -am package

      - name: Assemble static site
        run: cp folia-phantom/folia-phantom-web/target/pasta-web.jar web/pasta-web.jar

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install browser test dependencies
        working-directory: web
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pasta-web-e2e-${{ github.sha }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
